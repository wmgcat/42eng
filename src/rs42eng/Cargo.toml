[package]
name = "rs42eng"
version = "0.1.0"
edition = "2024"

[dependencies]
wasm-bindgen = "0.2.88"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.3"
js-sys = "0.3"
web-sys = { version = "0.3.77", features = ["Window"] }

[lib]
name = "byte"
path = "src/byte.rs"
crate-type = ["cdylib", "rlib"]